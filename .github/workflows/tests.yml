name: unit tests

# The unit tests need only the repository (features/, research/ OSM snapshot, scripts/). tests/test_course.py checks
# a full build (data/, build/, output/: LiDAR, imagery, Blender) and runs locally after scripts/build_all.py.
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests --ignore=tests/test_course.py
