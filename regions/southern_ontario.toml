# Wall tints (multipliers on the white stucco texture: white, cream, beige siding, warm grey, buff, red / brown brick),
# backdrop roof colours (asphalt shingle), parking stall width / length / aisle (m), share of SUVs among parked cars.
[buildings]
wall_palette = [[1.0, 1.0, 1.0], [0.97, 0.93, 0.82], [0.86, 0.8, 0.68], [0.74, 0.74, 0.72], [0.9, 0.84, 0.72], [0.62, 0.4, 0.31], [0.5, 0.35, 0.28]]
roof_palette = [[0.34, 0.33, 0.32], [0.28, 0.24, 0.22], [0.45, 0.42, 0.38], [0.38, 0.27, 0.22], [0.22, 0.23, 0.25]]
parking_stall = [2.6, 5.5, 6.5]
suv_share = 0.4

# The spring photo drapes the 5 km backdrop in dormant lawns and leaf-off woods: vegetated pixels (NDVI ramp) are graded
# to summer_green (sRGB) when summer_grade is true.
[backdrop]
summer_grade = true
summer_green = [86, 106, 56]
ndvi = [0.08, 0.22]

# Ground textures (Poly Haven sets) for wooded rough (deciduous leaf litter) and native areas.
[materials]
deeprough = "forest_leaves_02"
native = "withered_grass"

# Viewer: crown tints per archetype and the sky / horizon gradient (pale summer horizon over green-grey ground).
[viewer]
species_tint = { maple = [1.0, 1.04, 0.9], oak = [0.9, 0.94, 0.78], pine = [0.84, 0.95, 0.9], spruce = [0.7, 0.84, 0.86], shrub = [1.0, 1.0, 0.9] }
sky = [[0.0, "#2f6db8"], [0.3, "#5f97d3"], [0.45, "#a9c7e3"], [0.5, "#d6e2ea"], [0.53, "#c2cdb8"], [1.0, "#7d8a64"]]
