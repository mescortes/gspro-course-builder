# 3D grass (Stix Games 3DG) hand-off and viewer preview, written as output/<slug>/gspro/grass_3dg.json. Heights and
# densities are estimates for cool-season rough (no public source gives per-surface 3DG values).
[grass]
about = "3D grass settings per OPCD surface. 3dg = Stix Games DirectX 11 Grass Shader material settings to start from (estimates, tune in Unity); viewer = our three.js preview. Masks: FBX colour layer 'Col' (R = grass type 1 density, G = grass type 2 / dry, B = 0) for 3DG 'Vertex density' mode."

[grass.3dg.common]
"Density Mode" = "Vertex density"
"Grass Types" = "2 textures (type 1 = green blades, type 2 = dry blades)"
layer = "600m cull"
"Density Falloff Start" = 12.0
"Grass Fade End" = 90.0
"Lighting Mode" = "Default PBR"
notes = "Target Density: smaller number = denser grass (Stix docs)"

[grass.3dg.SemiRough]
blade_height_m = [0.025, 0.045]
blade_width_m = 0.006
relative_density = 1.0

[grass.3dg.Rough]
blade_height_m = [0.045, 0.085]
blade_width_m = 0.007
relative_density = 0.9

[grass.3dg.DeepRough]
blade_height_m = [0.12, 0.32]
blade_width_m = 0.008
relative_density = 0.55

[grass.viewer]
radius_m = 55
full_density_m = 22
far_density = 0.18
tile_m = 6
max_instances = 400000

[grass.viewer.wind]
strength = 0.35
speed = 1.0

[grass.viewer.surfaces.SemiRough]
height = [0.03, 0.05]
width = 0.008
density = 45
blades = 8
colour_tip = [1.06, 1.1, 1.02]
dry = 0.0

[grass.viewer.surfaces.Rough]
