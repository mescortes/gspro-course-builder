# Southern Ontario parkland (Westmount, Whistle Bear, Deer Ridge): cool-season turf (bentgrass greens, bluegrass /
# ryegrass / fine fescue), maple / oak / white pine / spruce tree lines, leaf-off spring photo and LiDAR.
# Read by scripts/config.py for a course whose [course] region = "southern_ontario". A course.toml table of the same
# name overrides it key by key (e.g. [turf_tint] or [trees.bark]).

[region]
name = "Southern Ontario"

# Turf colour of the glTF / viewer textures (sRGB): the spring photo shows dormant, hazy turf (greens straw-coloured), so
# the median colour of each turf surface is moved to a summer target and the photo only contributes the local variation
# (mowing, wear, shade). GSPro assigns its own turf materials by name. Targets are Lab a* -13..-19, b* +20..+26: with the
# viewer's sunlight and tone mapping (Neutral, exposure 1.5) they render as summer bentgrass / bluegrass in sun (fairway
# a* ~-20, b* ~+32). The first targets (a* -25..-28) rendered as a saturated "Kelly green".
[turf_tint]
green = [105, 130, 78]
fringe = [101, 124, 74]
fairway = [106, 124, 74]
tee = [105, 126, 76]
semirough = [96, 113, 68]
rough = [89, 105, 65]
bunker = [196, 180, 146]

# LiDAR tree archetypes (detect_trees), their bark (Poly Haven sets) and the backdrop billboard mix (backdrop_objects:
# crown radius = clip(a * height + b, lo, hi), about a third of the height):
#   maple  sugar / silver / Norway maple, basswood: dense rounded deciduous crowns
#   oak    red / bur oak, honey locust, ash: broad, more open, irregular crowns
#   pine   eastern white pine (+ Scots / red pine): tall, open, layered, high crown base
#   spruce Norway / white / blue spruce, cedar: dense narrow cones with branches to the ground
#   shrub  under 4.5 m
[trees]
archetypes = ["maple", "oak", "pine", "spruce", "shrub"]
classifier = "leaf_off_parkland"
bark = { maple = "trident_maple_bark", oak = "jolcham_oak_bark_01", pine = "pine_bark", spruce = "knotted_pine_bark", shrub = "bark_brown_01" }
backdrop = { kinds = ["maple", "oak", "spruce"], share = [0.5, 0.35, 0.15], crown = [0.3, 0.5, 2.0, 8.0] }

# detect_trees.leaf_off_parkland: leaf-off LiDAR (evergreens stop the pulses) + leaf-off photo (only evergreens green).
# conifer = penetration < conifer_pen, or (crown NDVI > a and penetration < b) for each [a, b] of conifer_green;
# pine = a conifer with crown base > pine_base of its height, or taller than pine_tall[0] m and flatter than pine_tall[1];
# oak = the hardwoods broader than the oak_pct percentile of crown radius / height (trees over oak_min_h m).
[trees.leaf_off_parkland]
shrub_h = 4.5
conifer_pen = 0.24
conifer_green = [[0.28, 0.32], [0.22, 0.27]]
pine_base = 0.4
pine_tall = [20, 2.0]
oak_pct = 65
oak_min_h = 6
oak_default = 0.35
names = { shrub = "shrub", pine = "pine", conifer = "spruce", broad = "oak", other = "maple" }

