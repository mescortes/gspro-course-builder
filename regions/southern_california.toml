# Southern California suburban and canyon courses (Los Angeles, Orange and San Diego counties): warm-season turf
# (bermuda / kikuyu fairways and rough, bent or Poa greens), irrigated through the dry summer; coast live oak, Aleppo
# pine, sycamore and eucalyptus round the holes; chaparral and coastal sage scrub on the hills beyond. Leaf-on summer
# photo (USDA NAIP) and leaf-on LiDAR (USGS 3DEP). The tree rule, shapes, foliage and bark are the MountainGate
# build's (Los Angeles, 2026); turf tint, buildings, grass, backdrop and sky are first estimates, to be tuned on the
# region's first build. A course.toml table of the same name overrides this file key by key.
#
# Known gaps:
#   * Palms (Mexican fan palm, Canary Island date palm, queen palm: common round clubhouses, entries and streets)
#     need a new tree model type (a bare trunk under a crown of fronds) that make_trees' branch growth cannot draw.
#     Until then the classifier puts them in one of the archetypes below.
#   * Course buildings keep the engine's grey roof tiles (add_structures); the terracotta here is the backdrop roofs.

[region]
name = "Southern California"

# Turf colour of the glTF / viewer textures (sRGB): summer bermuda / kikuyu, greener than Northern California's dry
# rough because the rough is irrigated too (Lab a* -14..-21, b* +25..+29); bunkers of pale washed sand.
[turf_tint]
green = [100, 128, 74]
fringe = [98, 122, 70]
fairway = [102, 124, 66]
tee = [102, 126, 70]
semirough = [104, 120, 64]
rough = [110, 120, 64]
bunker = [214, 202, 172]

# Archetypes (MountainGate): coast live oak (dense, broad, low evergreen crowns), Aleppo pine (open, peaked, high crown
# base; long paired needles), sycamore (California / London plane: light yellow-green crowns), eucalyptus (very tall,
# narrow, open), shrub (under 4.5 m: toyon, laurel sumac, ornamental hedges). Bark: the Poly Haven sets MountainGate
# fetched (fetch_textures adds them to its list).
[trees]
archetypes = ["coast_live_oak", "aleppo_pine", "sycamore", "eucalyptus", "shrub"]
needles = { aleppo_pine = "pine" }
classifier = "leaf_on_suburban_socal"
bark = { coast_live_oak = "jolcham_oak_bark_01", aleppo_pine = "pine_bark", sycamore = "bark_platanus", eucalyptus = "eucalyptus_bark", shrub = "bark_brown_01" }
# Backdrop billboards (DSM peaks over 5 m beyond the course): scrub oak and live oak on the chaparral / coastal sage
# hills, eucalyptus windbreaks, a few pines.
backdrop = { kinds = ["coast_live_oak", "shrub", "eucalyptus", "aleppo_pine"], share = [0.45, 0.3, 0.15, 0.1], crown = [0.35, 0.8, 2.0, 9.0] }

# detect_trees.leaf_on_suburban_socal: robust z-scores (over the trees taller than z_min_h m) of crown structure
# (LiDAR) and crown colour (photo). shrub under shrub_h m; eucalyptus taller than euc_min_h m, crown radius / height
# under euc_max_ratio and penetration over euc_min_pen; sycamore a crown colour score over syc_min_z, taller than
# syc_min_h m; pine when its structure score beats the oak score by pine_margin; the rest oak.
# lidar_leaf_off / imagery_leaf_off: the data these rules need (leaf-on LiDAR: penetration is crown form, not leaf
# state; a summer photo: sycamores are bare in winter). check_course.py flags a course whose [lidar] / [imagery]
# leaf_off differs.
[trees.leaf_on_suburban_socal]
lidar_leaf_off = false
imagery_leaf_off = false
shrub_h = 4.5
z_min_h = 6.0
euc_min_h = 19.0
euc_max_ratio = 0.3
euc_min_pen = 0.3
syc_min_z = 1.6
syc_min_h = 6.0
pine_margin = 0.3
names = { shrub = "shrub", eucalyptus = "eucalyptus", sycamore = "sycamore", pine = "aleppo_pine", oak = "coast_live_oak" }

