# Wall tints (on the white stucco texture: white, cream, sand, peach and tan stucco, light grey), backdrop roofs (clay
# tile terracotta in three shades, brown and grey concrete tile), US parking stalls (9 x 18 ft, 24 ft aisle), more SUVs
# and pickups.
[buildings]
wall_palette = [[0.98, 0.96, 0.9], [0.95, 0.9, 0.78], [0.88, 0.8, 0.66], [0.92, 0.8, 0.68], [0.8, 0.7, 0.56], [0.78, 0.77, 0.74]]
roof_palette = [[0.62, 0.33, 0.22], [0.7, 0.4, 0.28], [0.55, 0.3, 0.22], [0.42, 0.32, 0.26], [0.45, 0.44, 0.42]]
parking_stall = [2.74, 5.49, 7.3]
suv_share = 0.55

# Summer photo: no grading (the chaparral and sage scrub hills stay olive and tan).
[backdrop]
summer_grade = false
summer_green = [112, 118, 70]
ndvi = [0.08, 0.22]

# Ground textures (Poly Haven sets): oak leaf litter under the trees, dry grass in the native areas.
[materials]
deeprough = "forest_leaves_02"
native = "withered_grass"

# Viewer: crown tints per archetype and the sky (hazy blue, a warm pale horizon over olive-tan hills).
[viewer]
species_tint = { coast_live_oak = [0.78, 0.86, 0.8], aleppo_pine = [0.86, 0.94, 0.9], sycamore = [1.0, 1.04, 0.86], eucalyptus = [0.86, 0.92, 0.9], shrub = [0.95, 0.94, 0.84] }
sky = [[0.0, "#3a74bc"], [0.3, "#6b9fd6"], [0.45, "#b6cfe5"], [0.5, "#e6e3d8"], [0.53, "#cdbf98"], [1.0, "#8d8058"]]

# new_course.py: NAD83(2011) UTM (zone 11N for most of the region), NAVD88 heights, USGS 3DEP LiDAR and 1 m DEM, NAIP
# 2024 (pinned: the USDA service keeps only the latest year per state). Leaf state: written into a new course's
# [lidar] / [imagery] leaf_off, to be checked against its own flight and photo dates.
[scaffold]
datum = "NAD83(2011)"
vertical = "NAVD88"
imagery_res = 0.6
lidar_leaf_off = false    # USGS 3DEP: leaf-on
imagery_leaf_off = false  # NAIP: summer photo
lidar = { provider = "usgs_3dep" }
backdrop = { provider = "cog_dem" }
imagery = { provider = "arcgis_imageserver", url = "https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer", mosaic_rule = { mosaicMethod = "esriMosaicNorthwest", where = "Name LIKE 'm%2024____'" }, bands = [0, 1, 2, 3], max_chunk_m = 1500.0 }
