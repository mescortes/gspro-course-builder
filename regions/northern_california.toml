# Northern California oak woodland and grassland (Brambles, Middletown, Lake County): warm-season zoysia tee to green,
# dry summer rough and native meadow, valley / live oak and gray pine around it, chaparral on the slopes; leaf-on
# summer photo (NAIP) and leaf-on LiDAR (USGS 3DEP). Values are first estimates, tuned on Brambles' first build.
# A course.toml table of the same name overrides this file key by key.

[region]
name = "Northern California"

# Turf colour of the glTF / viewer textures (sRGB): irrigated zoysia in summer; the rough is dry, golden native grass.
[turf_tint]
green = [100, 128, 70]
fringe = [98, 122, 68]
fairway = [108, 126, 70]
tee = [106, 126, 72]
semirough = [112, 120, 72]
rough = [146, 136, 92]
bunker = [208, 190, 154]

# Oak-woodland archetypes: valley oak (big, broad, deciduous), live / blue oak (smaller, dense), gray pine (tall, narrow,
# sparse grey-green needles), shrub (chamise / manzanita chaparral under 4.5 m). Leaf-on data: crown form decides.
[trees]
archetypes = ["valley_oak", "live_oak", "gray_pine", "shrub"]
needles = { gray_pine = "pine" }
classifier = "leaf_on_woodland"
bark = { valley_oak = "jolcham_oak_bark_01", live_oak = "bark_brown_01", gray_pine = "pine_bark", shrub = "bark_brown_01" }
backdrop = { kinds = ["live_oak", "valley_oak", "gray_pine"], share = [0.5, 0.35, 0.15], crown = [0.35, 0.8, 2.0, 9.0] }

[trees.leaf_on_woodland]
shrub_h = 4.5
pine_min_h = 10.0
pine_max_ratio = 0.22
pine_min_pen = 0.35
big_h = 12.0
names = { shrub = "shrub", pine = "gray_pine", big = "valley_oak", other = "live_oak" }

[trees.shapes.valley_oak]
H = 16.0
R = 9.0
