# Wall tints (on the white stucco texture: warm white, beige and tan stucco, grey, wood brown, barn red), backdrop roofs
# (grey metal, brown, terracotta), US parking stalls (9 x 18 ft, 24 ft aisle), more SUVs and pickups.
[buildings]
wall_palette = [[0.97, 0.93, 0.84], [0.9, 0.84, 0.72], [0.82, 0.74, 0.6], [0.74, 0.72, 0.68], [0.55, 0.4, 0.3], [0.45, 0.22, 0.18]]
roof_palette = [[0.42, 0.43, 0.44], [0.3, 0.27, 0.24], [0.55, 0.33, 0.24], [0.5, 0.48, 0.44]]
parking_stall = [2.74, 5.49, 7.3]
suv_share = 0.55

# Summer photo: no grading (the hills stay golden).
[backdrop]
summer_grade = false
summer_green = [120, 116, 70]
ndvi = [0.08, 0.22]

[materials]
deeprough = "forest_leaves_02"
native = "withered_grass"

[viewer]
species_tint = { valley_oak = [0.95, 0.96, 0.82], live_oak = [0.78, 0.86, 0.8], gray_pine = [0.88, 0.94, 0.92], shrub = [0.95, 0.94, 0.84] }
sky = [[0.0, "#3a78c0"], [0.3, "#6aa0d6"], [0.45, "#b2cde4"], [0.5, "#e2e4de"], [0.53, "#cfc29a"], [1.0, "#9a8a5a"]]

# new_course.py: NAD83(2011) UTM, NAVD88 heights, USGS 3DEP LiDAR and 1 m DEM, NAIP 2024 (pinned: the USDA service
# keeps only the latest year per state).
[scaffold]
datum = "NAD83(2011)"
vertical = "NAVD88"
imagery_res = 0.6
lidar = { provider = "usgs_3dep" }
backdrop = { provider = "cog_dem" }
imagery = { provider = "arcgis_imageserver", url = "https://apps.geo.fpac.usda.gov/geo-imagery/rest/services/naip/conus_naip/ImageServer", mosaic_rule = { mosaicMethod = "esriMosaicNorthwest", where = "Name LIKE 'm%2024____'" }, bands = [0, 1, 2, 3], max_chunk_m = 1500.0 }
