[tests]
# Black yardages of the 2021 card no deck reaches: the markers stand at the back of the rearmost decks (QA round 1;
# hole 1 backs onto the clubhouse parking lot, hole 11 onto the rock wall and pond), see research/NOTES.md
known_tee_gaps = { "1.black" = 43.0, "11.black" = 10.0 }

[stroke_index]  # the 2021 card
men = [3, 1, 11, 7, 17, 5, 9, 13, 15, 6, 10, 16, 12, 18, 8, 4, 14, 2]
women = [3, 1, 11, 9, 15, 13, 7, 17, 5, 6, 10, 2, 14, 18, 12, 8, 16, 4]

# Men: Golf Ontario certificate effective 2016-08-19; women: the club's 2017 card. Gold, Blue and White were rated at
# their pre-2019 par-71 lengths (no newer public rating: Golf Canada Score Centre needs a member login).
[ratings]  # tee = { men = [rating, slope], women = [rating, slope], yards }
black = { men = [76.7, 137], yards = 7562 }
gold = { men = [73.6, 130], yards = 6936 }
blue = { men = [71.1, 126], women = [77.2, 136], yards = 6414 }
white = { men = [67.8, 121], women = [73.5, 127], yards = 5803 }
