# Westmount Golf & Country Club, Kitchener, Ontario (Stanley Thompson, 1931). Read by scripts/config.py (COURSE=westmount).
# Anything not set here comes from the region preset (regions/<region>.toml), then the engine defaults in config.py.

[course]
name = "Westmount Golf & Country Club"
short = "Westmount G&CC"
layout = "18 holes"
model_name = "westmount"           # output/westmount/<model_name>.glb, <model_name>_noveg.glb
unity_script = "WestmountSetup.cs"  # rendered from unity/Editor/CourseSetup.cs.in into the GSPro package
region = "southern_ontario"         # regions/southern_ontario.toml: species, foliage, turf tint, buildings ...

[frame]
# NAD83(CSRS) / UTM zone 17N, the frame of the Ontario LiDAR; heights CGVD2013 (m)
crs = "EPSG:2958"
crs_label = "NAD83(CSRS) / UTM zone 17N (EPSG:2958); heights CGVD2013 (m)"
origin = [537500.0, 4810850.0]
base_h = 345.0  # metres CGVD2013 subtracted from heights in the model frame
# Build extent: all 18 holes (OSM course outline E 536898-538156, N 4810400-4811320) + >= 100 m margin, 6 x 5 tiles of 256 m.
core = { xmin = 536760.0, ymin = 4810220.0, xmax = 538296.0, ymax = 4811500.0 }
# Unity/GSPro terrain square (2048 m, 4097^2 heightmap at 0.5 m) centred on CORE; cells outside CORE come from the backdrop DEM
terrain = { xmin = 536504.0, ymin = 4809836.0, xmax = 538552.0, ymax = 4811884.0 }

[lidar]
leaf_off = true  # March 2018 flights: deciduous crowns are sparse in the CHM (detect_trees.py closes them)

# Data providers (scripts/sources).
[sources.lidar]
# OMAFRA Lidar 2016-18, Lake Erie package (leaf-off, the course tiles flown 2018-03-21), 1 km COPC tiles from NRCan
# CanElevation. Licence: Open Government Licence - Ontario / - Canada.
provider = "nrcan_copc"
zone = 17
projects = [{ folder = "ON/Lake_Erie_2018", suffix = "2018LLAKEERIE" }]

[sources.imagery]
# Ontario SWOOP 2025 (Geospatial Ontario), 16 cm, R G B NIR, flown 2025-04-07 over the course.
provider = "arcgis_imageserver"
url = "https://ws.geoservices.lrc.gov.on.ca/arcgis5/rest/services/AerialImagery/GEO_Imagery_Data_Service_2023to2027/ImageServer"
mosaic_rule = { mosaicMethod = "esriMosaicNorthwest", where = "Project='SWOOP2025'" }
bands = [0, 1, 2, 3]  # R, G, B, NIR

[sources.backdrop]
# NRCan HRDEM 1 m DTM / DSM from the same 2018 survey; the City of Waterloo 2014 DTM fills any gap.
provider = "cog_dem"
dtm = ["https://canelevation-dem.s3.ca-central-1.amazonaws.com/hrdem-lidar/ON-Lake_Erie_2018-1m-dtm.tif",
       "https://canelevation-dem.s3.ca-central-1.amazonaws.com/hrdem-lidar/VILLE_WATERLOO-VILLE_WATERLOO-1m-dtm.tif"]
dsm = ["https://canelevation-dem.s3.ca-central-1.amazonaws.com/hrdem-lidar/ON-Lake_Erie_2018-1m-dsm.tif",
       "https://canelevation-dem.s3.ca-central-1.amazonaws.com/hrdem-lidar/VILLE_WATERLOO-VILLE_WATERLOO-1m-dsm.tif"]

[imagery]
# Ontario SWOOP 2025, 0.16 m, 4 bands (R, G, B, NIR), native EPSG:2958, Open Government Licence - Ontario
# (scripts/fetch_imageserver.py), over CORE + 20 m. The pipeline reads the registered copy written by
# register_imagery.py; band 4 (NIR) feeds the classifier, everything else reads bands 1-3.
raw = "swoop2025_course.tif"
registered = "swoop2025_course_reg.tif"
res = 0.16
# SWOOP 2025 vs the 2018 LiDAR (measure_registration.py, 59 bunkers: photo sand vs LiDAR hollows): dx 0.00 m,
# dy -0.25 m, MAD 0.25 m, uniform over the course (north/south/east/west halves agree); OSM buildings within 0.5 m
shift = [0.0, -0.25]  # metres +E/+N applied to the photo
leaf_off = true  # spring photo: the ground is visible through the bare crowns (vectorize.py keeps it)
credit = "Contains information licensed under the Open Government Licence - Ontario (SWOOP 2025 orthoimagery)"

[holes]
# OSM golf=hole refs 1-18 are the course holes (verified against the scorecard pars)
playable = "1-18"
scenery = []  # holes visible from play but not played (none at Westmount)
nines = { Front = "1-9", Back = "10-18" }

# Tee sets, back to front. Scorecard yardages follow this order. The club's combination sets (Blue/White, White/Red,
# Red/Gold) reuse these boxes hole by hole and need no geometry of their own.
[[tees]]
key = "blue"
name = "Blue"
colour = "#2a52be"
gkd_slot = "Blue"  # GreenKeeper TeeType (GKD tee slot)

[[tees]]
key = "white"
name = "White"
colour = "#f5f5f5"
gkd_slot = "White"

[[tees]]
key = "red"
name = "Red"
colour = "#c8102e"
gkd_slot = "Red"

[[tees]]
key = "gold"
name = "Gold"
colour = "#d4a017"
gkd_slot = "Yellow"

# Golf Canada Score Centre (course 20954), live 2026-10-11 = the 2025-07 card (new back tees on 5 and 11 in 2024, hole 8
# lengthened in 2025). Cross-checked against the club's 2024 card, Golf Ontario and Wayback captures
# (courses/westmount/research/NOTES.md). hole = [par, blue, white, red, gold]
[scorecard]
1 = [5, 559, 535, 514, 433]
2 = [4, 373, 357, 335, 286]
3 = [3, 195, 179, 165, 160]
4 = [4, 412, 385, 365, 323]
5 = [5, 605, 568, 527, 455]
6 = [3, 202, 180, 163, 133]
7 = [5, 541, 503, 483, 449]
8 = [4, 305, 275, 260, 245]
9 = [4, 401, 373, 346, 334]
10 = [4, 334, 319, 304, 217]
11 = [5, 580, 540, 502, 451]
12 = [3, 141, 127, 108, 93]
13 = [5, 554, 520, 503, 439]
14 = [4, 375, 359, 318, 293]
15 = [4, 453, 396, 367, 315]
16 = [4, 439, 418, 400, 359]
17 = [3, 165, 149, 132, 113]
18 = [4, 384, 367, 351, 334]

[stroke_index]  # holes 1-18 (Golf Canada 2026 allocation)
men = [7, 13, 9, 1, 3, 15, 11, 17, 5, 12, 6, 18, 8, 10, 2, 4, 16, 14]
women = [3, 11, 15, 9, 1, 17, 5, 13, 7, 14, 6, 18, 8, 12, 2, 4, 16, 10]

[ratings]  # tee = { men = [rating, slope], women = [rating, slope], yards } - Golf Canada, re-rated late 2024
blue = { men = [73.0, 132], yards = 7018 }
white = { men = [71.1, 129], women = [76.9, 135], yards = 6550 }
red = { men = [69.3, 121], women = [75.1, 130], yards = 6143 }
gold = { men = [66.3, 113], women = [71.3, 121], yards = 5432 }

[structures]
parking = [824691380, 485368326, 184857598]  # OSM amenity=parking lots by the clubhouse that get parked cars

# Engine settings pinned to the behaviour the golden build (fingerprint.json) was made with.
[tuning.bunker_hollow]
# Unmapped bunkers were validated with the mean-depth hollow test alone. The closed-hollow test (vectorize.closed_hollow)
# would drop two shallow hole-99 patches that hold no water (26 m2 at E 537872 N 4810855, 20 m2 at E 537917 N 4810805).
pond_frac = 0.0

[test_profile]  # MG_PROFILE=test: a small regression build around holes 1-2, in build/westmount-test/
core = { xmin = 537340.0, ymin = 4810720.0, xmax = 537980.0, ymax = 4811360.0 }
terrain = { xmin = 537340.0, ymin = 4810720.0, xmax = 537980.0, ymax = 4811360.0 }
holes = [1, 2]
